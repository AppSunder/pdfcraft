name: Test Windows exe
on:
  push:
    branches: [test-build/windows-exe]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pdfcraft
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-windows-x64-printfix
          path: target/release/pdfcraft.exe
          if-no-files-found: error
          retention-days: 7
